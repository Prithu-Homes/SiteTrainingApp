<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Data View</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --dv-ink: #0d2a4b;
      --dv-muted: #4f6177;
      --dv-sky: #eef4fc;
      --dv-border: #d7e2f0;
      --dv-accent: #1e69c8;
      --dv-accent-strong: #0f4b9d;
      --dv-card: #ffffff;
      --dv-soft: #f8fbff;
      --dv-ok: #047857;
      --dv-warn: #b45309;
      --dv-shadow: 0 14px 28px rgba(11, 38, 69, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at 15% 0%, #f7fbff 0, #f7fbff 24%, transparent 62%),
        linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
      color: var(--dv-ink);
      font-family: "Manrope", sans-serif;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    .data-shell {
      background: var(--dv-card);
      border: 1px solid var(--dv-border);
      border-radius: 18px;
      box-shadow: var(--dv-shadow);
      overflow: hidden;
    }

    .data-head {
      padding: 1.5rem 1.5rem 1.2rem;
      border-bottom: 1px solid var(--dv-border);
      background: linear-gradient(135deg, #ffffff 0%, #f4f9ff 100%);
    }

    .data-title {
      margin: 0;
      font-size: clamp(1.65rem, 3vw, 2.5rem);
      letter-spacing: -0.02em;
      color: #08213d;
    }

    .data-subtitle {
      margin-top: 0.35rem;
      color: var(--dv-muted);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      margin-top: 1rem;
    }

    .btn {
      border-radius: 10px;
      font-weight: 700;
      border: 1px solid transparent;
      padding: 0.55rem 0.9rem;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: var(--dv-accent);
    }

    .btn-primary:hover {
      background: var(--dv-accent-strong);
    }

    .btn-ghost {
      background: #fff;
      color: var(--dv-accent-strong);
      border-color: #b6cff0;
    }

    .entry-pill {
      margin-left: 0.2rem;
      color: var(--dv-muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .utility-bar {
      padding: 1rem 1.5rem;
      background: var(--dv-soft);
      border-bottom: 1px solid var(--dv-border);
      display: grid;
      gap: 0.75rem;
    }

    .search-wrap {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }

    #table-search {
      flex: 1;
      min-width: 260px;
      padding: 0.65rem 0.85rem;
      border: 1px solid #c9d8ea;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    .jump-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      font-size: 0.9rem;
    }

    .jump-link {
      text-decoration: none;
      border: 1px solid #c4d7f1;
      color: var(--dv-accent-strong);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: #fff;
      transition: all 0.16s ease;
    }

    .jump-link:hover {
      transform: translateY(-1px);
      border-color: var(--dv-accent);
      background: #f4f9ff;
    }

    .tables-wrap {
      padding: 1.2rem 1.5rem 2rem;
    }

    .page-group {
      border: 1px solid var(--dv-border);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      margin-bottom: 1rem;
    }

    .page-group > summary,
    .section-group > summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    .page-group > summary::-webkit-details-marker,
    .section-group > summary::-webkit-details-marker {
      display: none;
    }

    .page-group > summary {
      padding: 0.95rem 1rem;
      background: linear-gradient(90deg, #0e3964 0%, #164a80 100%);
      color: #fff;
      display: flex;
      gap: 0.7rem;
      align-items: center;
      font-weight: 800;
    }

    .page-sections {
      padding: 0.8rem;
      background: #f8fbff;
      display: grid;
      gap: 0.7rem;
    }

    .section-group {
      background: #fff;
      border: 1px solid var(--dv-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .section-group > summary {
      padding: 0.8rem 0.9rem;
      background: #f4f9ff;
      border-bottom: 1px solid var(--dv-border);
      color: #14375f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
    }

    .summary-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .summary-meta {
      color: #45648b;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .table-scroll {
      overflow: auto;
    }

    .training-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--dv-border);
      background: linear-gradient(90deg, #f8fbff 0%, #eef5ff 100%);
    }

    .training-tools-label {
      font-size: 0.83rem;
      font-weight: 800;
      color: #214c7a;
      margin-right: 0.1rem;
    }

    .training-tools-select,
    .training-tools-input {
      border: 1px solid #c2d5ed;
      border-radius: 8px;
      padding: 0.35rem 0.5rem;
      background: #fff;
      color: #163d65;
      font-size: 0.84rem;
      min-height: 2rem;
    }

    .training-tools-select {
      min-width: 190px;
    }

    .training-tools-input {
      min-width: 220px;
    }

    .training-tools-add {
      min-height: 2rem;
      padding: 0.25rem 0.6rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      font-size: 0.92rem;
    }

    th {
      background: var(--dv-accent);
      color: #fff;
      text-align: left;
      padding: 0.62rem 0.55rem;
      border: 1px solid #2c78d6;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    td {
      border: 1px solid #dce6f3;
      padding: 0.55rem;
      vertical-align: top;
      color: #102e4f;
    }

    tbody tr:nth-child(even) td {
      background: #fbfdff;
    }

    tr.card-start-row td {
      border-top: 3px solid #7fb2ea;
    }

    tr.video-start-row td {
      border-top: 2px dashed #9fbfe6;
    }

    tr.video-start-row .key-cell {
      font-weight: 800;
      color: #0d3f73;
    }

    tr.card-swatch-even td {
      background: #f8fbff;
    }

    tr.card-swatch-odd td {
      background: #fefbf5;
    }

    tr.card-swatch-even:nth-child(even) td,
    tr.card-swatch-odd:nth-child(even) td {
      filter: saturate(0.985);
    }

    tr.card-group-header-row td {
      background: linear-gradient(90deg, #e9f3ff 0%, #f4f9ff 100%);
      border-top: 2px solid #6da6e5;
      border-bottom: 1px solid #c7dbf3;
      padding: 0.45rem 0.55rem;
    }

    .card-group-header-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
    }

    .card-group-toggle {
      border: none;
      background: transparent;
      color: #0f3c6b;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      padding: 0.2rem 0;
    }

    .card-group-meta {
      color: #51739a;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .key-cell {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.84rem;
      font-weight: 600;
      word-break: break-word;
    }

    .value-input {
      width: 100%;
      min-height: 2.1rem;
      resize: vertical;
      border: 1px solid #c9d8ea;
      border-radius: 8px;
      padding: 0.45rem 0.5rem;
      font: 500 0.9rem/1.35 "Manrope", sans-serif;
      color: #0f2f53;
      background: #fffef0;
      outline: none;
    }

    .value-input:focus {
      border-color: var(--dv-accent);
      box-shadow: 0 0 0 3px rgba(30, 105, 200, 0.14);
    }

    .path-cell {
      color: #385678;
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .selector-cell code {
      display: inline-block;
      font-size: 0.78rem;
      color: #143b66;
      background: #e9f2ff;
      border: 1px solid #cfdef2;
      border-radius: 6px;
      padding: 0.15rem 0.35rem;
      margin-bottom: 0.25rem;
    }

    .selector-link {
      display: inline-block;
      color: var(--dv-accent-strong);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .selector-link:hover {
      text-decoration: underline;
    }

    .action-cell {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .mini-btn {
      border: 1px solid #c8d8ed;
      background: #fff;
      color: #0f4b9d;
      border-radius: 7px;
      padding: 0.2rem 0.45rem;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mini-btn:hover {
      background: #f1f7ff;
      border-color: #9fc0e8;
    }

    .status-line {
      padding: 0.45rem 1.5rem 0.8rem;
      color: #446485;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .data-note {
      color: #5b7391;
      font-size: 0.86rem;
    }

    .hidden-row {
      display: none !important;
    }

    @media (max-width: 768px) {
      .data-head,
      .utility-bar,
      .tables-wrap {
        padding-left: 0.85rem;
        padding-right: 0.85rem;
      }

      .top-actions {
        gap: 0.45rem;
      }

      .btn {
        font-size: 0.85rem;
      }

      #table-search {
        min-width: 100%;
      }

      .training-tools-select,
      .training-tools-input {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation Placeholder -->
  <nav class="navbar" style="position: relative; margin-bottom: 2rem">
    <div class="nav-container">
      <a href="index.html" class="logo">Back to Home</a>
    </div>
  </nav>

  <div class="container">
    <div class="data-shell">
      <div class="data-head">
        <h1 class="data-title">Static Content Data</h1>
        <p class="data-subtitle">
          Edit content from <code>content.json</code> with guided grouping:
          <strong>Page &gt; Section &gt; Section Item</strong>.
        </p>
        <div class="top-actions">
          <button id="download-json-btn" class="btn btn-primary">Download JSON</button>
          <button id="expand-all-btn" class="btn btn-ghost">Expand All</button>
          <button id="collapse-all-btn" class="btn btn-ghost">Collapse All</button>
          <span id="entry-count" class="entry-pill">0 content entries</span>
        </div>
      </div>

      <div class="utility-bar">
        <div class="search-wrap">
          <input id="table-search" type="search" placeholder="Search by key, value, path, selector..." />
          <span class="data-note">Tip: use keywords like <code>hero</code>, <code>title</code>, <code>videos</code>.</span>
        </div>
        <div id="section-jump-links" class="jump-links"></div>
      </div>

      <div class="status-line" id="filter-status">Showing all entries</div>

      <div id="tables-container" class="tables-wrap">
        <!-- Grouped data will be injected here by table-renderer.js -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="content.js"></script>
  <script src="table-renderer.js"></script>
</body>

</html>
