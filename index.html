<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <!-- MSAL.js for Microsoft Authentication -->
  <script src="https://alcdn.msauth.net/browser/2.32.0/js/msal-browser.min.js"></script>
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <div style="display: flex; align-items: center; gap: 1rem">
        <a href="#" id="brand-link" class="logo">
          <img id="brand-logo" src="" alt="" />
        </a>
        <img id="app-logo" src="" alt="" style="height: 40px; width: auto" />
      </div>
      <div class="nav-links"></div>
      <div class="nav-auth">
        <div id="guest-area" style="display: flex; gap: 1.5rem; align-items: center">
          <a href="#" id="login-btn" class="btn-text"></a>
          <a href="#" id="signup-btn" class="btn btn-primary"></a>
        </div>
        <div id="user-area" class="hidden" style="display: flex; gap: 1.5rem; align-items: center">
          <span id="user-name" style="font-weight: 600"></span>
          <a href="#" id="logout-btn" class="btn-text"></a>
        </div>
      </div>
      <div class="hamburger"><span></span><span></span><span></span></div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <div class="video-container">
      <video id="hero-video" class="video-bg" muted loop playsinline></video>
      <div class="overlay"></div>
    </div>
    <div class="hero-content">
      <h1></h1>
      <p></p>
      <div class="cta-buttons">
        <button class="btn btn-primary"></button>
        <button class="btn btn-outline"></button>
      </div>
    </div>
  </header>

  <!-- Features Section -->
  <section id="training" class="features">
    <div class="container">
      <div class="section-header">
        <h2></h2>
        <p></p>
      </div>
      <div class="feature-grid"></div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p id="footer-text"></p>
    </div>
  </footer>


  <!-- Scripts -->
  <script src="videos.js"></script>
  <script src="auth.js"></script>
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>

</html>
